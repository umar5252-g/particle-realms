<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Audio-Reactive Cherry Blossom Tree over Glowing 3D Ocean — Three.js WebGL Experience"/>
  <title>Cherry Blossom Ocean — 3D WebGL Experience</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;}
    body{overflow:hidden;background:#000;font-family:'Outfit',sans-serif;}
    canvas{display:block;}
    #overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;
      align-items:center;justify-content:center;z-index:10;background:radial-gradient(ellipse at center,
      rgba(15,5,25,.92) 0%,rgba(0,0,0,.98) 100%);transition:opacity .8s ease;pointer-events:auto;}
    #overlay.hidden{opacity:0;pointer-events:none;}
    #overlay h1{font-size:clamp(1.8rem,5vw,3.5rem);font-weight:700;
      background:linear-gradient(135deg,#ff6fd8,#ff9a9e,#fad0c4,#fbc2eb);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5em;text-align:center;}
    #overlay p{color:rgba(255,255,255,.55);font-size:clamp(.85rem,2vw,1.1rem);margin-bottom:2em;text-align:center;max-width:480px;line-height:1.6;}
    #startBtn{padding:14px 48px;font-size:1.05rem;font-family:'Outfit',sans-serif;font-weight:500;
      border:none;border-radius:50px;cursor:pointer;
      background:linear-gradient(135deg,#ff6fd8 0%,#3813c2 100%);color:#fff;
      box-shadow:0 0 30px rgba(255,111,216,.35);transition:transform .25s,box-shadow .25s;}
    #startBtn:hover{transform:scale(1.06);box-shadow:0 0 50px rgba(255,111,216,.55);}
    #info{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.3);
      font-size:.75rem;z-index:5;pointer-events:none;letter-spacing:.04em;}
  </style>
</head>
<body>

<div id="overlay">
  <h1>🌸 Cherry Blossom Ocean</h1>
  <p>An audio-reactive 3D experience. Click to begin — your microphone will capture ambient sound to drive the visuals.</p>
  <button id="startBtn">Enter Experience</button>
</div>
<div id="info">Drag to orbit · Scroll to zoom · Audio-reactive visuals</div>

<!-- Three.js + addons from CDN (ES module imports via importmap) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ───────────────────────── GLOBALS ───────────────────────── */
let scene, camera, renderer, composer, controls, clock;
let analyser, dataArray, audioCtx;
let oceanMesh, trunkGroup, petalParticles, fireflyParticles;
let audioLevel = 0;
const PETAL_COUNT = 6000;
const FIREFLY_COUNT = 800;
const MAX_LOOP = 50000; // bounded loop safety

/* ───────────────────────── AUDIO SETUP ───────────────────── */
async function initAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    source.connect(analyser);
  } catch (e) {
    console.warn('Microphone unavailable — using synthetic pulse.', e);
    analyser = null;
  }
}

function getAudioLevel() {
  if (analyser) {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    const len = Math.min(dataArray.length, MAX_LOOP);
    for (let i = 0; i < len; i++) sum += dataArray[i];
    return sum / len / 255;
  }
  // Synthetic fallback: gentle pulsing
  return 0.25 + 0.2 * Math.sin(performance.now() * 0.002);
}

/* ───────────────────────── SCENE INIT ────────────────────── */
function init() {
  clock = new THREE.Clock();

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  // Scene
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0015, 0.012);
  scene.background = new THREE.Color(0x05000d);

  // Camera
  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 8, 22);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 8;
  controls.maxDistance = 60;
  controls.maxPolarAngle = Math.PI * 0.52;
  controls.target.set(0, 5, 0);

  // Post-processing
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.4, 0.6, 0.25
  );
  composer.addPass(bloom);

  // Lights
  const ambient = new THREE.AmbientLight(0x2a1040, 0.6);
  scene.add(ambient);
  const moonLight = new THREE.DirectionalLight(0xccd0ff, 0.9);
  moonLight.position.set(20, 40, -10);
  scene.add(moonLight);
  const pinkPoint = new THREE.PointLight(0xff6fd8, 2.5, 50);
  pinkPoint.position.set(-3, 12, 2);
  scene.add(pinkPoint);
  const cyanPoint = new THREE.PointLight(0x00e5ff, 1.5, 40);
  cyanPoint.position.set(5, 6, -4);
  scene.add(cyanPoint);

  createOcean();
  createTree();
  createPetals();
  createFireflies();
  createStars();

  window.addEventListener('resize', onResize);
}

/* ───────────────────────── OCEAN ─────────────────────────── */
function createOcean() {
  const geo = new THREE.PlaneGeometry(120, 120, 200, 200);
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    side: THREE.DoubleSide,
    uniforms: {
      uTime: { value: 0 },
      uAudio: { value: 0 },
      uColor1: { value: new THREE.Color(0x0a001a) },
      uColor2: { value: new THREE.Color(0x3813c2) },
      uColor3: { value: new THREE.Color(0x00e5ff) },
    },
    vertexShader: `
      uniform float uTime;
      uniform float uAudio;
      varying vec2 vUv;
      varying float vHeight;
      void main(){
        vUv = uv;
        vec3 pos = position;
        float wave1 = sin(pos.x * 0.3 + uTime * 0.8) * cos(pos.y * 0.25 + uTime * 0.6);
        float wave2 = sin(pos.x * 0.6 - uTime * 1.1) * sin(pos.y * 0.4 + uTime * 0.9);
        float wave3 = cos(pos.x * 0.15 + pos.y * 0.15 + uTime * 0.5);
        float h = (wave1 + wave2 * 0.5 + wave3 * 0.7) * (1.0 + uAudio * 2.5);
        pos.z = h;
        vHeight = h;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColor1, uColor2, uColor3;
      uniform float uTime;
      varying vec2 vUv;
      varying float vHeight;
      void main(){
        float t = smoothstep(-1.5, 2.5, vHeight);
        vec3 col = mix(uColor1, uColor2, t);
        col = mix(col, uColor3, smoothstep(1.0, 2.5, vHeight));
        float edge = smoothstep(0.0, 0.08, abs(fract(vUv.x * 40.0 + uTime * 0.1) - 0.5));
        col += (1.0 - edge) * uColor3 * 0.08;
        float glow = pow(max(vHeight, 0.0) / 3.0, 2.0) * 0.6;
        col += glow * uColor3;
        gl_FragColor = vec4(col, 0.88);
      }
    `
  });
  oceanMesh = new THREE.Mesh(geo, mat);
  oceanMesh.rotation.x = -Math.PI / 2;
  oceanMesh.position.y = -0.5;
  scene.add(oceanMesh);
}

/* ───────────────────────── CHERRY TREE ───────────────────── */
function createTree() {
  trunkGroup = new THREE.Group();
  scene.add(trunkGroup);

  const trunkMat = new THREE.MeshStandardMaterial({
    color: 0x2a1515,
    roughness: 0.85,
    metalness: 0.1,
    emissive: 0x1a0520,
    emissiveIntensity: 0.15,
  });

  // Main trunk
  buildBranch(trunkGroup, trunkMat, new THREE.Vector3(0, 0, 0), 10, 0.55, 0, 0);

  // Foliage clusters (glowing spheres)
  const foliagePositions = [
    [0, 11, 0, 3.2], [-2.5, 10.5, 1.5, 2.5], [2, 10, -1.5, 2.2],
    [-1, 12, -1, 2.0], [1.5, 11.8, 1, 1.8], [-3, 9, -2, 1.6],
    [3, 9.5, 2, 1.5], [0, 13, 0.5, 1.4],
  ];

  const foliageMat = new THREE.ShaderMaterial({
    transparent: true,
    uniforms: {
      uTime: { value: 0 },
      uAudio: { value: 0 },
    },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vPos;
      void main(){
        vNormal = normalMatrix * normal;
        vPos = (modelViewMatrix * vec4(position,1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uAudio;
      varying vec3 vNormal;
      varying vec3 vPos;
      void main(){
        float fresnel = pow(1.0 - abs(dot(normalize(vNormal), normalize(-vPos))), 2.5);
        vec3 pink = vec3(1.0, 0.44, 0.85);
        vec3 white = vec3(1.0, 0.92, 0.96);
        float pulse = 0.7 + 0.3 * sin(uTime * 2.0 + vPos.y * 0.5);
        vec3 col = mix(pink, white, fresnel) * (pulse + uAudio * 0.8);
        float alpha = 0.25 + fresnel * 0.45 + uAudio * 0.15;
        gl_FragColor = vec4(col, alpha);
      }
    `,
    side: THREE.DoubleSide,
    depthWrite: false,
  });

  const boundedLen = Math.min(foliagePositions.length, MAX_LOOP);
  for (let i = 0; i < boundedLen; i++) {
    const [x, y, z, r] = foliagePositions[i];
    const geo = new THREE.SphereGeometry(r, 24, 18);
    const mesh = new THREE.Mesh(geo, foliageMat.clone());
    mesh.position.set(x, y, z);
    trunkGroup.add(mesh);
  }
}

function buildBranch(parent, mat, origin, height, radius, angleX, angleZ, depth = 0) {
  if (depth > 5) return; // bounded recursion

  const geo = new THREE.CylinderGeometry(radius * 0.4, radius, height, 8, 1);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(origin);
  mesh.position.y += height / 2;
  mesh.rotation.x = angleX;
  mesh.rotation.z = angleZ;
  parent.add(mesh);

  if (depth < 3) {
    const branchCount = depth === 0 ? 4 : 2;
    const bounded = Math.min(branchCount, MAX_LOOP);
    for (let i = 0; i < bounded; i++) {
      const a = (Math.PI * 2 / branchCount) * i + Math.random() * 0.5;
      const newH = height * (0.55 + Math.random() * 0.15);
      const newR = radius * 0.55;
      const off = new THREE.Vector3(
        Math.sin(a) * height * 0.18,
        height * (0.6 + Math.random() * 0.3),
        Math.cos(a) * height * 0.18
      ).add(origin);
      buildBranch(parent, mat, off, newH, newR, (Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 0.6, depth + 1);
    }
  }
}

/* ───────────────────────── PETAL PARTICLES ────────────────── */
function createPetals() {
  const positions = new Float32Array(PETAL_COUNT * 3);
  const velocities = new Float32Array(PETAL_COUNT * 3);
  const colors = new Float32Array(PETAL_COUNT * 3);
  const sizes = new Float32Array(PETAL_COUNT);
  const phases = new Float32Array(PETAL_COUNT);

  const pink1 = new THREE.Color(0xff6fd8);
  const pink2 = new THREE.Color(0xff9a9e);
  const white = new THREE.Color(0xfff0f5);

  const bounded = Math.min(PETAL_COUNT, MAX_LOOP);
  for (let i = 0; i < bounded; i++) {
    positions[i * 3]     = (Math.random() - 0.5) * 30;
    positions[i * 3 + 1] = Math.random() * 25 + 2;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 30;

    velocities[i * 3]     = (Math.random() - 0.5) * 0.02;
    velocities[i * 3 + 1] = -Math.random() * 0.02 - 0.005;
    velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.02;

    const c = Math.random();
    const col = c < 0.4 ? pink1 : c < 0.7 ? pink2 : white;
    colors[i * 3]     = col.r;
    colors[i * 3 + 1] = col.g;
    colors[i * 3 + 2] = col.b;

    sizes[i] = Math.random() * 0.35 + 0.08;
    phases[i] = Math.random() * Math.PI * 2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 },
      uPixelRatio: { value: renderer.getPixelRatio() },
    },
    vertexShader: `
      attribute float size;
      attribute vec3 color;
      uniform float uTime;
      uniform float uPixelRatio;
      varying vec3 vColor;
      varying float vAlpha;
      void main(){
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * uPixelRatio * (180.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
        vAlpha = smoothstep(0.0, 3.0, position.y) * (0.6 + 0.4 * sin(uTime * 1.5 + position.x));
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;
      void main(){
        float d = length(gl_PointCoord - 0.5);
        if(d > 0.5) discard;
        float a = smoothstep(0.5, 0.1, d) * vAlpha;
        gl_FragColor = vec4(vColor, a * 0.85);
      }
    `,
  });

  petalParticles = new THREE.Points(geo, mat);
  petalParticles.userData.velocities = velocities;
  petalParticles.userData.phases = phases;
  scene.add(petalParticles);
}

/* ───────────────────────── FIREFLIES ─────────────────────── */
function createFireflies() {
  const positions = new Float32Array(FIREFLY_COUNT * 3);
  const sizes = new Float32Array(FIREFLY_COUNT);
  const phases = new Float32Array(FIREFLY_COUNT);

  const bounded = Math.min(FIREFLY_COUNT, MAX_LOOP);
  for (let i = 0; i < bounded; i++) {
    positions[i * 3]     = (Math.random() - 0.5) * 50;
    positions[i * 3 + 1] = Math.random() * 18 + 1;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
    sizes[i] = Math.random() * 0.3 + 0.05;
    phases[i] = Math.random() * Math.PI * 2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
    vertexShader: `
      attribute float size;
      uniform float uTime;
      uniform float uPixelRatio;
      varying float vBright;
      void main(){
        float phase = position.x * 0.3 + position.z * 0.3;
        vBright = 0.3 + 0.7 * pow(sin(uTime * 1.2 + phase) * 0.5 + 0.5, 3.0);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * uPixelRatio * (120.0 / -mv.z) * vBright;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying float vBright;
      void main(){
        float d = length(gl_PointCoord - 0.5);
        if(d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d);
        vec3 col = mix(vec3(0.0, 0.9, 1.0), vec3(0.4, 1.0, 0.6), vBright);
        gl_FragColor = vec4(col * vBright, a * 0.7);
      }
    `,
  });

  fireflyParticles = new THREE.Points(geo, mat);
  fireflyParticles.userData.phases = phases;
  scene.add(fireflyParticles);
}

/* ───────────────────────── STARS ──────────────────────────── */
function createStars() {
  const COUNT = 2500;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(COUNT * 3);
  const bounded = Math.min(COUNT, MAX_LOOP);
  for (let i = 0; i < bounded; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 100 + Math.random() * 100;
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = Math.abs(r * Math.cos(phi));
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.35,
    color: 0xccbbff,
    transparent: true,
    opacity: 0.7,
    sizeAttenuation: true,
  });
  scene.add(new THREE.Points(geo, mat));
}

/* ───────────────────────── RESIZE ────────────────────────── */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
}

/* ───────────────────────── ANIMATION ─────────────────────── */
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.1); // clamp delta

  // Audio
  audioLevel += (getAudioLevel() - audioLevel) * 0.12;

  // Ocean
  if (oceanMesh) {
    oceanMesh.material.uniforms.uTime.value = t;
    oceanMesh.material.uniforms.uAudio.value = audioLevel;
  }

  // Foliage pulse
  if (trunkGroup) {
    const bounded = Math.min(trunkGroup.children.length, MAX_LOOP);
    for (let i = 0; i < bounded; i++) {
      const child = trunkGroup.children[i];
      if (child.material && child.material.uniforms) {
        child.material.uniforms.uTime.value = t;
        child.material.uniforms.uAudio.value = audioLevel;
      }
    }
  }

  // Petal physics
  if (petalParticles) {
    petalParticles.material.uniforms.uTime.value = t;
    const pos = petalParticles.geometry.attributes.position.array;
    const vel = petalParticles.userData.velocities;
    const phases = petalParticles.userData.phases;
    const bounded = Math.min(PETAL_COUNT, MAX_LOOP);
    for (let i = 0; i < bounded; i++) {
      const i3 = i * 3;
      // Wind + audio turbulence
      const wind = Math.sin(t * 0.5 + phases[i]) * 0.006 * (1 + audioLevel * 3);
      pos[i3]     += vel[i3] + wind;
      pos[i3 + 1] += vel[i3 + 1] * (1 + audioLevel * 2);
      pos[i3 + 2] += vel[i3 + 2] + Math.cos(t * 0.4 + phases[i]) * 0.004;

      // Spiral drift
      const dx = pos[i3], dz = pos[i3 + 2];
      const dist = Math.sqrt(dx * dx + dz * dz) + 0.01;
      pos[i3]     += (-dz / dist) * 0.003;
      pos[i3 + 2] += ( dx / dist) * 0.003;

      // Reset if fallen below ocean or drifted too far
      if (pos[i3 + 1] < -0.5 || dist > 35) {
        pos[i3]     = (Math.random() - 0.5) * 10;
        pos[i3 + 1] = 10 + Math.random() * 15;
        pos[i3 + 2] = (Math.random() - 0.5) * 10;
      }
    }
    petalParticles.geometry.attributes.position.needsUpdate = true;
  }

  // Firefly drift
  if (fireflyParticles) {
    fireflyParticles.material.uniforms.uTime.value = t;
    const pos = fireflyParticles.geometry.attributes.position.array;
    const phases = fireflyParticles.userData.phases;
    const bounded = Math.min(FIREFLY_COUNT, MAX_LOOP);
    for (let i = 0; i < bounded; i++) {
      const i3 = i * 3;
      pos[i3]     += Math.sin(t * 0.3 + phases[i]) * 0.008;
      pos[i3 + 1] += Math.cos(t * 0.2 + phases[i] * 1.3) * 0.005;
      pos[i3 + 2] += Math.sin(t * 0.25 + phases[i] * 0.7) * 0.008;
    }
    fireflyParticles.geometry.attributes.position.needsUpdate = true;
  }

  controls.update();
  composer.render();
}

/* ───────────────────────── ENTRY ──────────────────────────── */
document.getElementById('startBtn').addEventListener('click', async () => {
  document.getElementById('overlay').classList.add('hidden');
  await initAudio();
  init();
  animate();
});
</script>
</body>
</html>
